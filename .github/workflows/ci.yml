name: CI

# Only run on pull requests to main (not on pushes)
on:
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: app boots with a full (dummy) config; DB-free endpoints respond.
  # No Docker / Supabase needed, runs in seconds.
  # ---------------------------------------------------------------------------
  smoke-build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.13.4 (matches Render's Python version exactly)
      - name: Set up Python 3.13.4
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: 'pip'  # Cache pip dependencies for faster builds

      # 3. Install system dependencies (python-magic requires libmagic C library)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      # 4. Install Python dependencies from requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo " No requirements.txt found"
            exit 1
          fi

      # 5. Smoke tests: boot the app with a full (dummy) config and hit
      #    DB-free endpoints. tests/conftest.py loads tests/test.env, so all
      #    ~50 required settings are present — no per-step env vars needed and
      #    no more force-merging past a check that could never pass.
      - name: Run smoke tests
        run: |
          python -m pytest tests/ -v -m "not integration"

  # ---------------------------------------------------------------------------
  # Thorough gate: spin up a real local Supabase stack, APPLY ALL MIGRATIONS,
  # and run the integration suite against it. This is simultaneously:
  #   * the regression net (real flows: signup/login/me/role), and
  #   * the migration-safety gate — a broken or backward-incompatible migration
  #     fails `supabase start`/`db reset` or the flows, turning the PR red.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.4
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` applies every file in supabase/migrations to a fresh
      # database. If a migration is broken or incompatible, this step fails and
      # the integration job never runs the tests — the breakage is caught here.
      - name: Start local Supabase (applies migrations)
        run: supabase start

      # conftest._read_supabase_env() runs `supabase status -o env` to pull the
      # live keys and points the app at the local stack, so no env wiring needed.
      - name: Run integration tests
        run: python -m pytest tests/ -v -m integration

      - name: Stop Supabase
        if: always()
        run: supabase stop
