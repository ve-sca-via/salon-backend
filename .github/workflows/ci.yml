name: CI

# Run on pull requests into staging and main (not on pushes), so dev -> staging
# is gated too and a red build never reaches staging.
on:
  pull_request:
    branches:
      - staging
      - main

# Least privilege. pull-requests: read is for the breaking-API step, which
# reads the PR's labels with `gh pr view`.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: app boots with a full (dummy) config; DB-free endpoints respond.
  # No Docker / Supabase needed, runs in seconds.
  # ---------------------------------------------------------------------------
  smoke-build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest (26.04) has no prebuilt Python 3.13.4
    
    steps:
      # 1. Checkout the code. Full history: the API breaking-change check reads
      #    the base branch's contract and this PR's commit messages.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python 3.13.4
      # NOTE: runtime.txt pins python-3.11.9 — these two disagree. Align them
      # with whatever the DigitalOcean production runtime actually uses.
      - name: Set up Python 3.13.4
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: 'pip'  # Cache pip dependencies for faster builds

      # 3. Install system dependencies (python-magic requires libmagic C library)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      # 4. Install Python dependencies from requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo " No requirements.txt found"
            exit 1
          fi

      # 5. Smoke tests: boot the app with a full (dummy) config and hit
      #    DB-free endpoints. tests/conftest.py loads tests/test.env, so all
      #    ~50 required settings are present — no per-step env vars needed and
      #    no more force-merging past a check that could never pass.
      - name: Run smoke tests
        run: |
          python -m pytest tests/ -v -m "not integration"

      # 6. The committed API contract (openapi/openapi.json) must match the
      #    code. Mobile apps generate their types from it, so a stale file means
      #    a client built against an API that doesn't exist.
      #    Fix: `python scripts/export_openapi.py` and commit the result.
      - name: Check OpenAPI contract is up to date
        run: python scripts/export_openapi.py --check

      # 7. Installed app builds live for months: the contract may only grow.
      #    Fails on removed paths/methods/response fields, newly-required
      #    inputs and type changes vs the base branch. Intentional break:
      #    `[breaking-api-ok]` in a commit message, or the `breaking-api-ok`
      #    PR label (read at run time, so re-run the job after labelling).
      #    See docs/CLIENT_APPS_AND_VERSIONING.md.
      - name: Check for breaking API changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PR_LABELS="$(gh pr view ${{ github.event.pull_request.number }} --json labels -q '[.labels[].name] | join(",")' 2>/dev/null || true)"
          python scripts/check_api_breaking.py --base-ref origin/${{ github.base_ref }}

  # ---------------------------------------------------------------------------
  # Thorough gate: spin up a real local Supabase stack, APPLY ALL MIGRATIONS,
  # and run the integration suite against it. This is simultaneously:
  #   * the regression net (real flows: signup/login/me/role), and
  #   * the migration-safety gate — a broken or backward-incompatible migration
  #     fails `supabase start`/`db reset` or the flows, turning the PR red.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest (26.04) has no prebuilt Python 3.13.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.4
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # pinned to the version used locally: v3 rejects [inbucket] in
          # supabase/config.toml. Upgrade local and CI together.
          version: 2.118.0

      # `supabase start` applies every file in supabase/migrations to a fresh
      # database. If a migration is broken or incompatible, this step fails and
      # the integration job never runs the tests — the breakage is caught here.
      - name: Start local Supabase (applies migrations)
        run: supabase start

      # conftest._read_supabase_env() runs `supabase status -o env` to pull the
      # live keys and points the app at the local stack, so no env wiring needed.
      - name: Run integration tests
        run: python -m pytest tests/ -v -m integration

      - name: Stop Supabase
        if: always()
        run: supabase stop
