[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    integration: test that requires a running local Supabase stack (`supabase start`). Excluded from the fast smoke job.
    e2e: end-to-end flow test against a DEPLOYED environment (tests/e2e). Opt-in only: not collected unless E2E_RUN=1 / --e2e (use scripts/run_e2e.py).
